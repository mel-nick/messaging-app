services:
  mongodb:
    image: mongo:latest
    container_name: chat-db
    ports:
      - '27017:27017'
    volumes:
      - ./data/db:/data/db
    environment:
      MONGO_INITDB_DATABASE: mydatabase
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    networks:
      - message

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: chat-backend
    container_name: backend
    depends_on:
      - mongodb
    ports:
      - '8080:80'
    environment:
      JWT_SECRET: 45v275fgg587e13ff34b
      JWT_REFRESH_SECRET: 30d327jwe912b61jn05l
      MONGODB_URI: mongodb://root:example@mongodb:27017/mydatabase?authSource=admin
      CR_TOKEN: $2b$10$GypBAEIkKes7or5vL1qM9ubXEZjd95uhUur8BX0rZ85CdS.iGq.HW
      PORT: 80
    networks:
      - message

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: chat-frontend
    container_name: frontend
    depends_on:
      - backend
    ports:
      - '3000:3000'
    networks:
      - message
networks:
  message:
    driver: bridge
